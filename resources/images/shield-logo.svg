<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Dark Blue Color -->
    <style>
      .cls-shield { fill: #d3d6dc; stroke: #052340; stroke-width: 14; stroke-linejoin: round; }
      .cls-dark { fill: #052340; }
      .cls-teal { fill: #0096b4; }
      .cls-text-main { font-family: 'Arial Black', Gadget, sans-serif; font-weight: 900; fill: #052340; text-anchor: middle; }
      .cls-text-sub { font-family: 'Arial', sans-serif; font-weight: bold; fill: #052340; text-anchor: middle; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background Shield -->
  <path class="cls-shield" d="M 250,25 
             C 380,25 440,60 450,150 
             C 460,300 400,480 250,625 
             C 100,480 40,300 50,150 
             C 60,60 120,25 250,25 Z" />

  <!-- Swoosh / Road Graphic -->
  <!-- Bottom swoosh/road wave -->
  <path class="cls-teal" d="M 175,265 C 240,240 310,240 340,265 C 320,250 270,245 220,260 Z" />
  
  <!-- Main upward-curved arrow/road graphic -->
  <path class="cls-teal" d="M 152,225 
             C 185,150 250,105 348,103
             L 340,90
             C 240,92 170,140 137,215 Z" />
             
  <!-- Arrowhead tip -->
  <polygon class="cls-teal" points="363,118 348,103 358,95" />

  <!-- FME Text -->
  <text x="250" y="380" class="cls-text-main" font-size="115" letter-spacing="4">FME</text>

  <!-- FUTURES MATTER EDUCATION Text -->
  <text x="250" y="445" class="cls-text-sub" font-size="34">FUTURES</text>
  <text x="250" y="495" class="cls-text-sub" font-size="34">MATTER</text>
  <text x="250" y="542" class="cls-text-sub" font-size="28" letter-spacing="6">EDUCATION</text>
</svg>
